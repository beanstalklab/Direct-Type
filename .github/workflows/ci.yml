name: ci

on:
  push:
  pull_request:

jobs:
  addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install fcitx5 headers and a C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfcitx5core-dev g++ cmake

      - name: Configure
        run: cmake -S addon -B addon/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build addon/build

      - name: Check that the addon loads
        run: ctest --test-dir addon/build --output-on-failure

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Add lint components
        run: rustup component add clippy rustfmt

      - name: Check the Vietnamese table against Unicode
        run: python3 scripts/verify_unicode_table.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check corpus
        run: cargo run -p viet-cli -- check tests/corpus

      - name: Build
        run: cargo build --workspace

      - name: C ABI smoke test
        run: bash scripts/c_smoke_test.sh
